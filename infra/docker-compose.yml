name: vieroclick

services:
  web:
    build:
      context: ../
      dockerfile: apps/web/Dockerfile
    env_file:
      - ../.env
    environment:
      # Re-enable the passwordless dev-bypass login on this deployment.
      # WARNING: anyone reaching the site can sign in as any email.
      ALLOW_DEV_BYPASS: "true"
    depends_on:
      - redis

  # Agent roles read live project state back from the web app over HTTP, so they
  # need its in-network address. Without this VIEROC_API_URL defaults to
  # http://localhost:3000 — which inside these containers is the container
  # itself, so every /api/project-data read failed and each role returned
  # "Could not retrieve project tasks and members" (Q&A, assignment, observer,
  # daily report). The bearer falls back to AGENT_API_SECRET in app/settings.py.
  agent-api:
    build:
      context: ../apps/agent-api
    env_file:
      - ../.env
    environment:
      VIEROC_API_URL: http://web:3000
    depends_on:
      - redis
      - web
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ../apps/agent-api
    env_file:
      - ../.env
    environment:
      VIEROC_API_URL: http://web:3000
    depends_on:
      - redis
      - web
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4

  scheduler:
    build:
      context: ../apps/agent-api
    env_file:
      - ../.env
    environment:
      VIEROC_API_URL: http://web:3000
    depends_on:
      - redis
      - web
    command: celery -A app.workers.celery_app beat --loglevel=info

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    ports:
      - "1988:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - agent-api

volumes:
  redis_data:
