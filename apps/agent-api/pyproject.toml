[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vieroc-agent-api"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "google-genai>=1.0.0",
    "openai>=1.55.0",
    "python-telegram-bot>=21.7.0",
    "celery[redis]>=5.4.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    # Converts intake uploads (pdf/docx/xlsx/pptx/images/…) to markdown before
    # they reach the planning + intake_review LLMs. We pin the concrete office/pdf
    # extras rather than [all]: [all] drags in az-content-understanding, whose only
    # release is a pre-release (azure-ai-contentunderstanding>=1.2.0b1) that uv
    # refuses by default and which this app never uses — image captioning goes
    # through the DeepSeek flash model instead (see doc_preprocess.py).
    "markitdown[pdf,docx,pptx,xlsx,xls]>=0.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
